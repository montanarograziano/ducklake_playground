# DuckLake Playground — Configuration
# All knobs are tunable. Restart the notebook after editing for changes to take effect.

playground:
  name: "DuckLake Playground"
  batch_size: 250_000        # Rows per streaming chunk; bounds generator memory.
                             # ~250K matches 16MB target_file_size at this schema's
                             # typical compression. Lower for tighter memory bounds,
                             # higher for less Python overhead per chunk.
  target_file_size_mb: 16    # Target Parquet file size (Delta engine; informational
                             # for DuckLake which uses set_option).
  parquet_row_group_size: 122_880  # Rows per Parquet row group within a file.

# Storage modes available. Set the data path / S3 connection below.
storage_modes:
  - local
  # - s3                     # Opt-in: requires MinIO (or real S3) running.

default_storage_mode: local

# Data generation schema. The generator always injects:
#   - id_col      (sequential int64, NOT NULL)
#   - event_date  (pa.date32, NOT NULL, partition key, derived from row id)
# Plus the columns listed below for type coverage.
schema:
  id_col: "id"
  seed: 42
  merge_overlap_ratio: 0.10  # Fraction of merge-source rows that reuse base IDs.
  columns:
    # Integers
    - { name: "int8_col", type: "int8" }
    - { name: "int16_col", type: "int16" }
    - { name: "int32_col", type: "int32" }
    - { name: "int64_col", type: "int64" }
    # Floats
    - { name: "float32_col", type: "float32" }
    - { name: "float64_col", type: "float64" }
    - { name: "decimal_col", type: "decimal", precision: 18, scale: 4 }
    # Temporal (additional to the canonical event_date partition column)
    - { name: "datetime_col", type: "datetime" }
    - { name: "timestamp_col", type: "timestamp" }
    # String (varchar is dict-encoded)
    - { name: "varchar_col", type: "varchar", cardinality: 1000 }
    - { name: "text_col", type: "text", avg_length: 128 }
    # Boolean
    - { name: "bool_col", type: "boolean" }
    # Complex
    - { name: "list_col", type: "list", child_type: "int32", avg_length: 5 }
    - { name: "struct_col", type: "struct", fields: ["a:int32", "b:varchar", "c:float64"] }
    - { name: "map_col", type: "map", key_type: "varchar", value_type: "int32", avg_length: 3 }

# Filter predicate — used by the engine's filtered_scan helper and as the default
# in the demo notebook. Date range applies to event_date (exercises partition pruning).
filter:
  date_range: ["2024-01-10", "2024-01-20"]
  varchar_values: ["value_001", "value_002", "value_003"]

# DuckLake metadata catalog (PostgreSQL).
postgres:
  host: "localhost"
  port: 5432
  database: "ducklake_playground"
  user: "user"
  password: "password"

# S3-compatible storage. Used only when storage_mode == "s3".
s3:
  endpoint: "http://localhost:9000"
  access_key: "minioadmin"
  secret_key: "miniopassword"
  bucket: "warehouse"
  ducklake_prefix: "ducklake/"

# Local filesystem storage. Relative paths are resolved against this YAML file's
# directory, so the data location is cwd-independent.
local:
  base_path: "data/"
  ducklake_prefix: "ducklake/"
